<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Avaliação - Automação de Testes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 36px 40px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
        }
        h1 {
            font-size: 1.2rem;
            color: #1a237e;
            text-align: center;
            margin-bottom: 28px;
            border-bottom: 2px solid #1a237e;
            padding-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.88rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
            margin-top: 16px;
        }
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background: #fafafa;
        }
        .nascimento {
            display: flex;
            gap: 10px;
        }
        .nascimento select {
            flex: 1;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .opcional {
            font-weight: normal;
            color: #888;
            font-size: 0.8rem;
        }
        button {
            margin-top: 28px;
            width: 100%;
            padding: 12px;
            background-color: #1a237e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #283593;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Avaliação disciplina automação de teste de software</h1>

    <form id="form-avaliacao">

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">

        <label for="ra">RA</label>
        <input type="text" id="ra" name="ra" placeholder="Digite seu RA">

        <label>Data de Nascimento</label>
        <div class="nascimento">
            <select id="dia" name="dia">
                <option value="">Dia</option>
                <!-- dias 1 a 31 -->
                <option>01</option><option>02</option><option>03</option>
                <option>04</option><option>05</option><option>06</option>
                <option>07</option><option>08</option><option>09</option>
                <option>10</option><option>11</option><option>12</option>
                <option>13</option><option>14</option><option>15</option>
                <option>16</option><option>17</option><option>18</option>
                <option>19</option><option>20</option><option>21</option>
                <option>22</option><option>23</option><option>24</option>
                <option>25</option><option>26</option><option>27</option>
                <option>28</option><option>29</option><option>30</option>
                <option>31</option>
            </select>
            <select id="mes" name="mes">
                <option value="">Mês</option>
                <option value="01">Janeiro</option>
                <option value="02">Fevereiro</option>
                <option value="03">Março</option>
                <option value="04">Abril</option>
                <option value="05">Maio</option>
                <option value="06">Junho</option>
                <option value="07">Julho</option>
                <option value="08">Agosto</option>
                <option value="09">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
            <select id="ano" name="ano">
                <option value="">Ano</option>
                <!-- anos de 1960 a 2010 -->
                <option>2010</option><option>2009</option><option>2008</option>
                <option>2007</option><option>2006</option><option>2005</option>
                <option>2004</option><option>2003</option><option>2002</option>
                <option>2001</option><option>2000</option><option>1999</option>
                <option>1998</option><option>1997</option><option>1996</option>
                <option>1995</option><option>1994</option><option>1993</option>
                <option>1992</option><option>1991</option><option>1990</option>
                <option>1985</option><option>1980</option><option>1975</option>
                <option>1970</option><option>1965</option><option>1960</option>
            </select>
        </div>

        <label for="curso">Curso</label>
        <select id="curso" name="curso">
            <option value="">Selecione o curso</option>
            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
            <option value="si">Sistemas de Informação</option>
        </select>

        <label for="aproveitamento">Aproveitamento do Conteúdo</label>
        <select id="aproveitamento" name="aproveitamento">
            <option value="">Selecione uma nota</option>
            <option>0</option><option>1</option><option>2</option>
            <option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option>
        </select>

        <label for="sugestoes">Sugestões de melhoria para próximas turmas</label>
        <textarea id="sugestoes" name="sugestoes" placeholder="Escreva suas sugestões..."></textarea>

        <label for="observacoes">Observações <span class="opcional">(opcional)</span></label>
        <textarea id="observacoes" name="observacoes" placeholder="Observações adicionais..."></textarea>

        <button type="button" id="btn-enviar">Enviar Feedback</button>

    </form>
</div>
</body>
</html>
